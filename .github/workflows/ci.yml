name: CI/CD Pipeline Practice

#set branches to trigger the workflow
on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main
#set environment variables for the workflow
#env:
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build C++ project
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build Docker image
        run: docker build -t cpp-cicd-demo .

      - name: Run Docker container
        run: docker run --rm cpp-cicd-demo
        #automated security check in its github actions pipeline
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
        #the Docker image to scan
          image-ref: cpp-cicd-demo
          #show readable scan results
          format: table
          #fail the workflow if vulnerabilities are found
          exit-code: '1'
          #check for high and critical severity
          severity: CRITICAL,HIGH
          #check operating system and library dependencies
          vuln-type: os,library
  
  publish:
    #wait until the build-and-test job is complete before running this job
    needs: build-and-test
    #publish only after push events to the main branch, not a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
        contents: read
        #allow publish packages to GitHub Container Registry (GHCR)
        packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        #autheticate securely to GitHub Container Registry (GHCR) using the GITHUB_TOKEN secret
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      #tag the image with the latest tag and the commit SHA, then push both tags to GHCR
      - name: Build and publish Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"